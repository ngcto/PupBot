# CI — the gates a change has to pass before it can merge.
#
# The graph, top to bottom:
#
#   setup ─┬─ static   (typecheck + lint)        ─┐
#          ├─ test     (postgres + migrations)    │
#          ├─ build    (web, marketing, api...)   ├─ ci   ← the one required check
#          ├─ e2e      (playwright + artifacts)   │
#          └─ desktop  (windows + linux shell)    ┘
#   pr-hygiene and dependency-review run on their own (pull requests only).
#   security runs alongside everything.
#
# Why `setup` exists at all: it resolves the repo's Node version and decides
# full-vs-affected-only exactly once, then installs with a warm pnpm store so
# the five jobs that need packages get them from cache instead of each pulling
# 1.3 GB. Nothing waits on anything but `setup`, so a type error no longer sits
# behind a Playwright run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 03:17 UTC: drift in `main` and in the dependency tree surfaces
    # without anyone opening a PR.
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Superseded PR runs are cancelled; pushes to `main` and scheduled runs keep
# their lane so merging does not kill a weekly run halfway through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need more opt in below.
permissions:
  contents: read

env:
  # CI-only placeholders, not credentials. `STUB_PROVIDER` serves a local stub
  # model endpoint so chat streams with no API key.
  DATABASE_URL: postgres://terabot:terabot@localhost:5432/terabot
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
  BETTER_AUTH_URL: http://localhost:3000
  API_URL: http://localhost:8787
  NEXT_PUBLIC_API_URL: http://localhost:8787
  CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  STUB_PROVIDER: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Node comes from the repo, never from this file. A `chore: bump node` PR
  # edits `engines.node` (and `.nvmrc` if present) and every job follows it, so
  # a Node bump and this workflow can land in either order.
  # ───────────────────────────────────────────────────────────────────────────
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      node-version: ${{ steps.node.outputs.version }}
      filter: ${{ steps.scope.outputs.filter }}
      scope: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A real merge base for `--filter=...[origin/main]` and enough history
          # for turbo to see which files a PR touched.
          fetch-depth: 0

      - id: node
        name: Resolve the Node version the repo declares
        run: |
          set -euo pipefail
          if [ -f .nvmrc ]; then
            version="$(tr -d '[:space:]' < .nvmrc)"
            source=".nvmrc"
          else
            # `engines.node` is a range like ">=24": take its first number.
            range="$(node -p "require('./package.json').engines.node")"
            version="$(printf '%s' "$range" | grep -oE '[0-9]+' | head -1)"
            source="package.json engines.node ($range)"
          fi
          [ -n "$version" ] || { echo "::error::could not resolve a Node version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Node $version (from $source)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm

      # Fails here, once, if the lockfile and the manifests disagree — instead of
      # in five parallel jobs.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Decided once, exported to every job. Empty filter = full run.
      - id: scope
        name: Decide full or affected-only
        run: |
          set -euo pipefail
          full=false
          base="${{ github.base_ref }}"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            full=true
            reason="full: not a pull request (${{ github.event_name }})"
          else
            reason="affected-only ($base)"
            # Root files that can change every package's behaviour at once. If
            # one of them moved, a package-level filter would under-test the PR,
            # so the whole suite runs.
            if git diff --name-only "origin/$base...HEAD" \
               | grep -qE '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|package\.json|tsconfig\.base\.json|\.npmrc|eslint\.config\.js|playwright\.config\.ts|\.env\.example|\.github/)'; then
              full=true
              reason="full: the PR changes a root file that affects every package"
            fi
          fi
          if [ "$full" = "true" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
          else
            echo "filter=--filter=...[origin/$base]" >> "$GITHUB_OUTPUT"
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "**Scope:** $reason" | tee -a "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Fast signals. Most PRs need only these two.
  # ───────────────────────────────────────────────────────────────────────────
  static:
    name: static
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-static-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-static-${{ runner.os }}-

      - name: Typecheck
        env:
          TURBO_FILTER: ${{ needs.setup.outputs.filter }}
        run: pnpm turbo run typecheck $TURBO_FILTER

      # Blocking, and it actually lints: `eslint.config.js` at the root covers
      # every workspace package and every package has a `lint` script. The rules
      # that are deliberately off are documented in that file with reasons.
      - name: Lint
        env:
          TURBO_FILTER: ${{ needs.setup.outputs.filter }}
        run: pnpm turbo run lint $TURBO_FILTER

  test:
    name: test
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: terabot
          POSTGRES_PASSWORD: terabot
          POSTGRES_DB: terabot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terabot -d terabot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-

      # Replay the migrations into an empty database — what a fresh deploy does.
      - name: Migrate from zero
        run: pnpm db:migrate

      # Journal integrity: fails when the snapshot chain is broken (a renumbered
      # or duplicated entry), which is the #8 bug class — a database that
      # upgrades cleanly and silently skips a migration.
      - name: Migration journal integrity
        working-directory: packages/db
        run: pnpm exec drizzle-kit check

      # Schema and migrations must agree. A schema change with no generated
      # migration produces a new .sql file here and fails the job, so nobody
      # ships a schema that only exists in code.
      - name: No pending schema changes
        run: |
          set -euo pipefail
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::schema.ts has changes no migration records. Run \`pnpm db:generate\` and commit the result."
            git status --porcelain packages/db/drizzle
            git --no-pager diff --stat packages/db/drizzle
            exit 1
          fi
          echo "schema and migrations are in sync" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test
        env:
          TURBO_FILTER: ${{ needs.setup.outputs.filter }}
        run: pnpm turbo run test $TURBO_FILTER

  build:
    name: build
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-

      # The four deployable/server apps. `apps/mobile` has no build task (Expo
      # exports on demand) and `apps/desktop` builds in the `desktop` job.
      - name: Build
        run: pnpm turbo run build --filter=@terabot/web --filter=@terabot/marketing --filter=@terabot/api --filter=@terabot/worker

  e2e:
    name: e2e
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: terabot
          POSTGRES_PASSWORD: terabot
          POSTGRES_DB: terabot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terabot -d terabot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate from zero
        run: pnpm db:migrate

      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      # The real flow: sign up → bot → computer → streamed reply → blocked
      # composer. `playwright.config.ts` retains trace and video on failure and
      # writes an HTML report in CI.
      - name: Playwright
        run: pnpm e2e
        env:
          CI: "true"

      # A red e2e run must be debuggable without re-running it. Traces and videos
      # are the only way to see what the browser saw.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Link the artifacts from the summary
        if: failure()
        run: |
          {
            echo "### Playwright failed"
            echo ""
            echo "Traces, videos and the HTML report are under **Artifacts** on this run:"
            echo ""
            echo "- \`playwright-report\` — download, then open \`index.html\`"
            echo "- \`test-results\` — per-test trace and video files"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # The desktop shell is Electron and its main process touches paths and shell
  # APIs that only misbehave on Windows, which CI never exercised. This builds
  # the bundle and runs its unit tests on both OSes. Packaging and release live
  # in release.yml.
  # ───────────────────────────────────────────────────────────────────────────
  desktop:
    name: desktop (${{ matrix.os }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @terabot/desktop typecheck
      - run: pnpm --filter @terabot/desktop lint
      - run: pnpm --filter @terabot/desktop test
      - run: pnpm --filter @terabot/desktop build

  # ───────────────────────────────────────────────────────────────────────────
  # PR hygiene: Ng's commit convention, enforced cheaply. Title and every commit
  # subject must be Conventional Commits. The body is not policed.
  # ───────────────────────────────────────────────────────────────────────────
  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # type(scope)!: summary — scope and `!` optional; type from the
          # Conventional Commits 1.0 set; a summary of at least three characters.
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: .{3,}$'
          status=0

          check() {
            label="$1"; subject="$2"
            if printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "ok   $label: $subject"
            else
              echo "::error title=Not Conventional Commits::$label is not conventional: \"$subject\". Expected \`type(scope): summary\` with type from build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test."
              status=1
            fi
          }

          check "PR title" "$PR_TITLE"

          # Every non-merge commit the PR adds. `--no-merges` keeps a "Merge
          # branch 'main'" commit from failing a branch that merged its base.
          while IFS= read -r subject; do
            [ -n "$subject" ] && check "commit" "$subject"
          done < <(git log --no-merges --format=%s "origin/${BASE_REF}...HEAD")

          if [ "$status" -ne 0 ]; then
            {
              echo "### Commit style"
              echo ""
              echo "This repo uses [Conventional Commits](https://www.conventionalcommits.org/): \`type(scope): summary\`."
              echo "Amend or rebase the branch; this check re-reads it on every push."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # ───────────────────────────────────────────────────────────────────────────
  # Security. Each step says whether it blocks.
  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: security
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # CodeQL writes its results to the repo's security tab.
      security-events: write
      # codeql-action reads the workflow run it belongs to.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # BLOCKING: a high or critical advisory in the tree fails the run.
      - name: Audit (high and above)
        run: pnpm audit --audit-level high

      # INFORMATIONAL on purpose: GitHub's advisory feed lags npm's, and a
      # moderate advisory with no fix yet must not block every PR in the repo.
      # Reported here, not enforced. Reasoning is in the PR body.
      - name: Audit (all severities, informational)
        continue-on-error: true
        run: pnpm audit || true

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Blocks on a vulnerable dependency the PR adds and on an incompatible
      # licence. Free for public repositories.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ───────────────────────────────────────────────────────────────────────────
  # The single name branch protection points at. Fails if any gate failed or was
  # skipped, so `cancelled` and `skipped` are never mistaken for a pass.
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: ci
    if: always()
    needs: [static, test, build, e2e, desktop, pr-hygiene, security, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Did every gate pass?
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$RESULTS" | node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              const needs = JSON.parse(raw);
              // These two are pull-request-only; a skip on a push is correct.
              const prOnly = new Set(["pr-hygiene", "dependency-review"]);
              const rows = [];
              let bad = 0;
              for (const [name, job] of Object.entries(needs)) {
                const result = job.result;
                const ok = result === "success" || (result === "skipped" && prOnly.has(name));
                if (!ok) bad++;
                rows.push(`${ok ? "pass" : "FAIL"}  ${name}: ${result}`);
              }
              console.log(rows.join("\n"));
              console.log("");
              console.log(bad === 0 ? "all gates passed" : `${bad} gate(s) did not pass`);
              process.exit(bad === 0 ? 0 : 1);
            });
          '
