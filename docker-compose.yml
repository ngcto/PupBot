services:
  postgres:
    image: postgres:17-alpine
    container_name: pupbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pupbot
      POSTGRES_PASSWORD: pupbot
      POSTGRES_DB: pupbot
    ports:
      - "5432:5432"
    volumes:
      - pupbot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pupbot -d pupbot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pupbot-pgdata:
