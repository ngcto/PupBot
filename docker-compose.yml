services:
  postgres:
    image: postgres:17-alpine
    container_name: terabot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: terabot
      POSTGRES_PASSWORD: terabot
      POSTGRES_DB: terabot
    ports:
      - "5432:5432"
    volumes:
      - terabot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terabot -d terabot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  terabot-pgdata:
